<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON DRIFT — Arcade Survival</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#05060a; overflow:hidden;
    font-family: 'Courier New', monospace; color:#e8f7ff;
  }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { background: radial-gradient(circle at 50% 30%, #0d1220 0%, #05060a 70%); display:block; box-shadow: 0 0 60px rgba(0,255,255,0.15); }
  #hud {
    position:absolute; top:16px; left:16px; font-size:18px; letter-spacing:1px;
    text-shadow: 0 0 8px #0ff; pointer-events:none;
  }
  #hud div { margin-bottom:4px; }
  #combo { color:#ff2ec4; text-shadow:0 0 8px #ff2ec4; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(2,3,8,0.85); gap:14px;
  }
  #overlay h1 {
    font-size:44px; letter-spacing:6px; color:#0ff; text-shadow:0 0 20px #0ff,0 0 40px #0ff;
  }
  #overlay h2 { color:#ff2ec4; text-shadow:0 0 12px #ff2ec4; font-size:22px; letter-spacing:2px;}
  #overlay p { color:#9ad; max-width:420px; line-height:1.6; font-size:14px; }
  #overlay button {
    margin-top:10px; padding:12px 30px; font-size:16px; letter-spacing:2px;
    background:transparent; border:2px solid #0ff; color:#0ff; cursor:pointer;
    text-shadow:0 0 8px #0ff; box-shadow:0 0 12px rgba(0,255,255,0.4);
    transition: all .15s;
  }
  #overlay button:hover { background:#0ff; color:#020308; }
  .hidden { display:none !important; }
  #hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:#557; font-size:12px; letter-spacing:1px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>BEST <span id="best">0</span></div>
    <div id="combo"></div>
  </div>
  <div id="hint">MOUSE / ARROW KEYS or WASD to move · SPACE to boost-brake</div>
  <div id="overlay">
    <h1>NEON DRIFT</h1>
    <p>Survive the shard storm. Dodge red shards, grab cyan orbs for score &amp; combo,
    grab magenta bolts for a temporary shield. The longer you survive, the faster it gets.</p>
    <button id="startBtn">START</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let best = Number(localStorage.getItem('neondrift_best') || 0);
  bestEl.textContent = best;

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  let mouse = { x: W/2, y: H/2, active:false };
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top) * (H / r.height);
    mouse.active = true;
  });
  canvas.addEventListener('mouseleave', () => mouse.active = false);

  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }

  let player, particles, shards, orbs, bolts, running, score, combo, comboTimer, shield, shieldTimer, t, spawnTimer, difficulty;

  function resetGame() {
    player = { x: W/2, y: H/2, r: 10, trail: [] };
    particles = [];
    shards = [];
    orbs = [];
    bolts = [];
    running = true;
    score = 0;
    combo = 1;
    comboTimer = 0;
    shield = false;
    shieldTimer = 0;
    t = 0;
    spawnTimer = 0;
    difficulty = 1;
  }

  function spawnShard() {
    const edge = Math.floor(rand(0,4));
    let x, y;
    if (edge === 0) { x = rand(0,W); y = -20; }
    else if (edge === 1) { x = W+20; y = rand(0,H); }
    else if (edge === 2) { x = rand(0,W); y = H+20; }
    else { x = -20; y = rand(0,H); }
    const angle = Math.atan2(player.y - y, player.x - x) + rand(-0.4,0.4);
    const speed = rand(1.4, 2.6) * difficulty;
    shards.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: rand(6,14), rot: rand(0,7), spin: rand(-0.1,0.1) });
  }

  function spawnOrb() {
    orbs.push({ x: rand(40,W-40), y: rand(40,H-40), r: 7, phase: rand(0,7) });
  }

  function spawnBolt() {
    bolts.push({ x: rand(40,W-40), y: rand(40,H-40), r: 9, phase: rand(0,7) });
  }

  function addParticles(x,y,color,n=10) {
    for (let i=0;i<n;i++) {
      particles.push({
        x, y, vx: rand(-3,3), vy: rand(-3,3),
        life: rand(20,40), maxLife: 40, color
      });
    }
  }

  function update() {
    t++;
    difficulty = 1 + t / 1800;

    // movement
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;

    const usingKeys = dx !== 0 || dy !== 0;
    const speed = keys[' '] ? 2.2 : 5;

    if (usingKeys) {
      const len = Math.hypot(dx,dy) || 1;
      player.x += (dx/len) * speed;
      player.y += (dy/len) * speed;
    } else if (mouse.active) {
      const ddx = mouse.x - player.x, ddy = mouse.y - player.y;
      const d = Math.hypot(ddx,ddy);
      if (d > 2) {
        const mv = Math.min(d, speed);
        player.x += (ddx/d)*mv;
        player.y += (ddy/d)*mv;
      }
    }
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));

    player.trail.push({x:player.x, y:player.y});
    if (player.trail.length > 14) player.trail.shift();

    // spawn logic
    spawnTimer++;
    const spawnRate = Math.max(10, 40 - difficulty*6);
    if (spawnTimer > spawnRate) {
      spawnTimer = 0;
      spawnShard();
      if (Math.random() < 0.03) spawnBolt();
    }
    if (Math.random() < 0.015) spawnOrb();

    // shards
    for (let i = shards.length-1; i>=0; i--) {
      const s = shards[i];
      s.x += s.vx; s.y += s.vy; s.rot += s.spin;
      if (s.x < -60 || s.x > W+60 || s.y < -60 || s.y > H+60) { shards.splice(i,1); continue; }
      const d = dist(s.x,s.y,player.x,player.y);
      if (d < s.r + player.r) {
        if (shield) {
          addParticles(s.x,s.y,'#ff2ec4',14);
          shards.splice(i,1);
          shield = false;
          shieldTimer = 0;
        } else {
          gameOver();
          return;
        }
      }
    }

    // orbs
    for (let i = orbs.length-1; i>=0; i--) {
      const o = orbs[i];
      o.phase += 0.08;
      const d = dist(o.x,o.y,player.x,player.y);
      if (d < o.r + player.r) {
        score += 10 * combo;
        combo = Math.min(combo + 1, 20);
        comboTimer = 90;
        addParticles(o.x,o.y,'#0ff',12);
        orbs.splice(i,1);
      }
    }

    // bolts (shield pickups)
    for (let i = bolts.length-1; i>=0; i--) {
      const b = bolts[i];
      b.phase += 0.08;
      const d = dist(b.x,b.y,player.x,player.y);
      if (d < b.r + player.r) {
        shield = true;
        shieldTimer = 300;
        addParticles(b.x,b.y,'#ff2ec4',16);
        bolts.splice(i,1);
      }
    }

    if (shieldTimer > 0) { shieldTimer--; if (shieldTimer===0) shield = false; }
    if (comboTimer > 0) { comboTimer--; } else { combo = 1; }

    // particles
    for (let i = particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i,1);
    }

    score += 0.06 * difficulty;
    scoreEl.textContent = Math.floor(score);
    comboEl.textContent = combo > 1 ? `COMBO x${combo}` : '';
  }

  function draw() {
    ctx.clearRect(0,0,W,H);

    // grid backdrop
    ctx.strokeStyle = 'rgba(0,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let gx=0; gx<W; gx+=40) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for (let gy=0; gy<H; gy+=40) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

    // particles
    particles.forEach(p => {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // orbs
    orbs.forEach(o => {
      const pulse = 1 + Math.sin(o.phase)*0.2;
      ctx.fillStyle = '#0ff';
      ctx.shadowColor = '#0ff'; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r*pulse,0,7); ctx.fill();
      ctx.shadowBlur = 0;
    });

    // bolts
    bolts.forEach(b => {
      const pulse = 1 + Math.sin(b.phase)*0.25;
      ctx.fillStyle = '#ff2ec4';
      ctx.shadowColor = '#ff2ec4'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*pulse,0,7); ctx.fill();
      ctx.shadowBlur = 0;
    });

    // shards
    shards.forEach(s => {
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate(s.rot);
      ctx.fillStyle = '#ff3355';
      ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0,-s.r); ctx.lineTo(s.r*0.8,s.r*0.6); ctx.lineTo(-s.r*0.8,s.r*0.6);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    });

    // trail
    player.trail.forEach((p,i) => {
      ctx.globalAlpha = (i / player.trail.length) * 0.4;
      ctx.fillStyle = '#e8f7ff';
      ctx.beginPath(); ctx.arc(p.x,p.y, player.r*0.6, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // player
    ctx.fillStyle = shield ? '#ff2ec4' : '#e8f7ff';
    ctx.shadowColor = shield ? '#ff2ec4' : '#0ff';
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;

    if (shield) {
      ctx.strokeStyle = 'rgba(255,46,196,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r+8, 0, 7); ctx.stroke();
    }
  }

  function loop() {
    if (!running) return;
    update();
    if (!running) return;
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    addParticles(player.x, player.y, '#e8f7ff', 40);
    draw();
    if (Math.floor(score) > best) {
      best = Math.floor(score);
      localStorage.setItem('neondrift_best', best);
      bestEl.textContent = best;
    }
    setTimeout(() => {
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <h1>RUN OVER</h1>
        <h2>SCORE ${Math.floor(score)}</h2>
        <p>Best: ${best}</p>
        <button id="startBtn">RETRY</button>
      `;
      document.getElementById('startBtn').addEventListener('click', startGame);
    }, 400);
  }

  function startGame() {
    overlay.classList.add('hidden');
    resetGame();
    loop();
  }

  startBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
